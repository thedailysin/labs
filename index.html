    function isDirectVideo(url){return /\.(?:mp4|webm|mov|m4v)(?:[?#]|$)/i.test(url||'')}function applyArt(layer,index,mediaOverride=''){const p=projects[index],media=mediaOverride||p.image,video=isDirectVideo(media)?document.createElement('video'):null;layer.replaceChildren(video||document.createElement('i'));if(video){video.src=media;video.muted=true;video.loop=true;video.playsInline=true;video.preload='metadata';video.setAttribute('muted','');video.setAttribute('playsinline','');video.play().catch(()=>{})}layer.style.setProperty('--a',p.palette[0]);layer.style.setProperty('--b',p.palette[1]);layer.style.setProperty('--c',p.palette[2]);layer.style.backgroundImage=media&&!video?`url("${media}")`:'';layer.className=`art art-${index%5}${media?' has-image':''}${layer===artNext?' next':''}`;if(layer===art){home.classList.remove('video-controls-visible');setupCoverVideo(video)}}
    function setupCoverVideo(video){document.getElementById('cover-controls')?.remove();const banner=$('banner-link');banner.onclick=null;if(!video)return;const controls=document.createElement('div');controls.className='cover-controls';controls.id='cover-controls';controls.innerHTML='<button class="cover-toggle" type="button" aria-label="Pause video">Ⅱ</button><button class="cover-sound" type="button">Sound on</button>';home.appendChild(controls);const toggle=controls.querySelector('.cover-toggle'),sound=controls.querySelector('.cover-sound'),sync=()=>{toggle.textContent=video.paused?'▶':'Ⅱ';toggle.setAttribute('aria-label',video.paused?'Play video':'Pause video')};toggle.onclick=e=>{e.preventDefault();e.stopPropagation();video.paused?video.play().catch(()=>{}):video.pause();sync()};sound.onclick=e=>{e.preventDefault();e.stopPropagation();video.muted=!video.muted;sound.textContent=video.muted?'Sound on':'Sound off'};video.addEventListener('play',sync);video.addEventListener('pause',sync);banner.onclick=e=>{if(!home.classList.contains('video-controls-visible')){e.preventDefault();home.classList.add('video-controls-visible');sync()}}}
    function projectUrl(p){const slug=p.slug||`${p.client}-${p.work}`.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');const q=new URLSearchParams({slug,title:p.title,client:p.client,category:p.category,industry:p.industry,work:p.work,palette:p.palette.join(',')});return `project-template.html?${q}`}
    function mobileBarWidth(category,industry){const rowOne=measureWord('I design')+measureWord(category)+20,rowTwo=measureWord('for')+measureWord(industry)+20;return Math.min(innerWidth-80,Math.ceil(Math.max(rowOne,rowTwo)+80))}
    function syncMobileBarWidth(category,industry){if(matchMedia('(max-width:700px)').matches)statement.style.width=mobileBarWidth(category,industry)+'px';else statement.style.width=''}
    function render(){const p=projects[current],url=projectUrl(p);applyArt(art,current);setWord('category',p.category);setWord('industry',p.industry);syncMobileBarWidth(p.category,p.industry);$('client').textContent=p.title;$('details').textContent=p.description;$('project-link').href=url;$('banner-link').href=url;$('banner-link').setAttribute('aria-label',`Open ${p.title}`)}
    function spinReel(field,finalValue,duration,delay){const button=$(field),windowEl=button.querySelector('.slot-window'),reel=button.querySelector('.slot-word'),start=hasStarted?projects[current][field]:(field==='category'?'Everything':'Everyone');if(start===finalValue){setWord(field,start);return Promise.resolve()}const pool=[...new Set(projects.map(p=>p[field]))].filter(v=>v!==start&&v!==finalValue),travel=field==='category'?7:9,sequence=[start];for(let i=0;i<travel;i++)sequence.push(pool[(current+i*3)%pool.length]);sequence.push('',finalValue);reel.innerHTML=sequence.map(value=>`<span>${value}</span>`).join('');reel.classList.add('spinning');const step=22,rest=reelRest(),end=rest-(sequence.length-1)*step,startSlotWidth=windowEl.getBoundingClientRect().width,targetSlotWidth=measureWord(finalValue);const reelMotion=reel.animate([{transform:`translateY(${rest}px)`,offset:0},{transform:`translateY(${rest-step*.3}px)`,offset:.1},{transform:`translateY(${end-step*.07}px)`,offset:.87},{transform:`translateY(${end+step*.025}px)`,offset:.96},{transform:`translateY(${end}px)`,offset:1}],{duration,delay,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'}).finished;const slotResize=windowEl.animate([{width:startSlotWidth+'px',offset:0},{width:targetSlotWidth+'px',offset:.62},{width:targetSlotWidth+'px',offset:1}],{duration:duration*.72,delay,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'}).finished;return Promise.all([reelMotion,slotResize]).then(()=>setWord(field,finalValue))}
    function targetBarWidth(target,startWidth){if(matchMedia('(max-width:700px)').matches)return mobileBarWidth(target.category,target.industry);const categoryWidth=$('category').querySelector('.slot-window').getBoundingClientRect().width,industryWidth=$('industry').querySelector('.slot-window').getBoundingClientRect().width;return startWidth-categoryWidth-industryWidth+measureWord(target.category)+measureWord(target.industry)}
    function changeTo(next){if(spinning)return;spinning=true;closePanel();const target=projects[next],startWidth=statement.getBoundingClientRect().width,targetWidth=targetBarWidth(target,startWidth);applyArt(artNext,next);const motion={duration:760,easing:'cubic-bezier(.32,.72,0,1)',fill:'forwards'};const outgoing=art.animate([{transform:'translateX(0) scale(1)',opacity:1},{transform:'translateX(18%) scale(.985)',opacity:.78}],motion);const incoming=artNext.animate([{transform:'translateX(-100%) scale(1.015)',opacity:.92},{transform:'translateX(0) scale(1)',opacity:1}],motion);const barMorph=statement.animate([{width:startWidth+'px',offset:0},{width:targetWidth+'px',offset:.64},{width:targetWidth+'px',offset:1}],{duration:600,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'}).finished;Promise.all([spinReel('category',target.category,810,0),spinReel('industry',target.industry,900,34),barMorph,outgoing.finished,incoming.finished]).then(()=>{statement.getAnimations().forEach(animation=>animation.cancel());current=next;hasStarted=true;render();outgoing.cancel();incoming.cancel();if(!matchMedia('(max-width:700px)').matches)statement.style.width='';spinning=false})}
    function paintPreview(panel,index){const preview=panel.querySelector('.selector-preview'),p=projects[index],videoSource=isDirectVideo(p.image),background=p.image&&!videoSource?`url("${p.image}")`:`linear-gradient(135deg,${p.palette[0]},${p.palette[1]} 52%,${p.palette[2]})`;preview.classList.toggle('has-image',Boolean(p.image));const previous=preview.querySelector('.preview-slide:last-of-type'),incoming=document.createElement('div');incoming.className='preview-slide';if(videoSource){incoming.innerHTML=`<video src="${p.image}" muted loop playsinline preload="metadata"></video><div class="preview-video-controls"><button class="preview-toggle" type="button">Ⅱ</button><button class="preview-sound" type="button">Sound on</button></div>`;const media=incoming.querySelector('video'),toggle=incoming.querySelector('.preview-toggle'),sound=incoming.querySelector('.preview-sound'),sync=()=>toggle.textContent=media.paused?'▶':'Ⅱ';media.play().catch(()=>{});incoming.onclick=e=>{e.stopPropagation();incoming.classList.add('controls-visible');sync()};toggle.onclick=e=>{e.stopPropagation();media.paused?media.play().catch(()=>{}):media.pause();sync()};sound.onclick=e=>{e.stopPropagation();media.muted=!media.muted;sound.textContent=media.muted?'Sound on':'Sound off'}}else incoming.style.backgroundImage=background;preview.appendChild(incoming);if(!previous){return}const motion={duration:680,easing:'cubic-bezier(.32,.72,0,1)',fill:'forwards'};const outMotion=previous.animate([{transform:'translateX(0) scale(1)',opacity:1},{transform:'translateX(18%) scale(.985)',opacity:.72}],motion),inMotion=incoming.animate([{transform:'translateX(-100%) scale(1.02)',opacity:.9},{transform:'translateX(0) scale(1)',opacity:1}],motion);Promise.all([outMotion.finished,inMotion.finished]).then(()=>{previous.remove();outMotion.cancel();inMotion.cancel()}).catch(()=>previous.remove())}
    function populatePanel(panel,field){clearInterval(panelTimer);const p=projects[current],options=[...new Set(projects.map(x=>x[field]))],pills=panel.querySelector('.pills'),preview=panel.querySelector('.selector-preview');pills.innerHTML='';options.forEach(option=>{const b=document.createElement('button');b.textContent=option;if(hasStarted&&option===p[field])b.className='active';b.onclick=e=>{e.stopPropagation();location.href=`category-template.html?type=${encodeURIComponent(field)}&value=${encodeURIComponent(option)}`};pills.appendChild(b)});let previewIndex=current;paintPreview(panel,previewIndex);[preview,pills].forEach((element,i)=>element.animate([{opacity:.18,transform:`translateY(${i?4:-3}px)`},{opacity:1,transform:'translateY(0)'}],{duration:i?320:420,easing:'cubic-bezier(.16,1,.3,1)'}));panelTimer=setInterval(()=>{previewIndex=(previewIndex+1)%projects.length;paintPreview(panel,previewIndex)},2500)}
    function showPanel(field){clearTimeout(panelCloseTimer);let panel=$('selector');setWord('category','Everything');setWord('industry','Everyone');syncMobileBarWidth('Everything','Everyone');if(panel&&!panel.classList.contains('is-closing')){open=field;wrap.classList.remove('open-category','open-industry');wrap.classList.add(`open-${field}`);populatePanel(panel,field);return}if(panel)panel.remove();wrap.querySelector('.selector-close')?.remove();open=field;panel=document.createElement('div');panel.className='selector';panel.id='selector';panel.innerHTML='<div class="selector-preview"></div><div class="pills"></div>';panel.onclick=closePanel;const closeControl=document.createElement('button');closeControl.className='selector-close';closeControl.type='button';closeControl.setAttribute('aria-label','Close filter menu');closeControl.textContent='×';closeControl.onclick=e=>{e.stopPropagation();closePanel()};wrap.prepend(panel);wrap.prepend(closeControl);wrap.classList.add('is-open',`open-${field}`);document.body.classList.add('filter-open');populatePanel(panel,field)}
    function closePanel(){clearInterval(panelTimer);panelTimer=null;const wasOpen=Boolean(open),panel=$('selector'),closeControl=wrap.querySelector('.selector-close');if(!panel){wrap.classList.remove('is-open','open-category','open-industry');document.body.classList.remove('filter-open');open=null;return}panel.classList.add('is-closing');closeControl?.classList.add('is-closing');document.body.classList.remove('filter-open');open=null;panelCloseTimer=setTimeout(()=>{panel.remove();closeControl?.remove();wrap.classList.remove('is-open','open-category','open-industry');if(wasOpen&&hasStarted){setWord('category',projects[current].category);setWord('industry',projects[current].industry);syncMobileBarWidth(projects[current].category,projects[current].industry)}},260)}
    $('category').onclick=e=>{e.stopPropagation();showPanel('category')};$('industry').onclick=e=>{e.stopPropagation();showPanel('industry')};statement.addEventListener('mouseenter',()=>hoveringStatement=true);statement.addEventListener('mouseleave',()=>hoveringStatement=false);wrap.onclick=()=>{if(open)closePanel()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});document.addEventListener('mousemove',e=>{const cursor=$('cursor-x');cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px'});addEventListener('resize',()=>syncMobileBarWidth(hasStarted?projects[current].category:'Everything',hasStarted?projects[current].industry:'Everyone'));setInterval(()=>{if(open||spinning||hoveringStatement)return;let next=current;while(next===current)next=Math.floor(Math.random()*projects.length);changeTo(next)},3000);applyArt(art,current,homepageFallback);$('client').textContent='';$('details').textContent='';syncMobileBarWidth('Everything','Everyone');const initialUrl=projectUrl(projects[current]);$('project-link').href=initialUrl;$('banner-link').href=initialUrl;
